name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            go.sum
            integration/hostcompat/go.sum
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gcc binutils zip
      - name: Isolated scratch directory
        run: |
          mkdir -p "$HOME/.cache"
          echo "TMPDIR=$(mktemp -d "$HOME/.cache/hopper-ci.XXXXXX")" >> "$GITHUB_ENV"
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go') $(git ls-files --others --exclude-standard '*.go'))"
      - name: Vet
        run: |
          go vet ./...
          go -C integration/hostcompat vet ./...
      - name: Race tests and release packaging contract
        run: go test -race -count=1 ./...
      - name: Real v8.0.63 host loader compatibility
        run: go -C integration/hostcompat test -race -count=1 ./...
      - name: Production C shared library
        run: |
          go build -trimpath -buildmode=c-shared -o "$TMPDIR/hopper.so" .
          nm -D "$TMPDIR/hopper.so" > "$TMPDIR/symbols.txt"
          grep -q ' T cliproxy_plugin_init$' "$TMPDIR/symbols.txt"
      - name: Secret scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          gitleaks dir --redact --no-banner .
          python3 -I scripts/check-public-files.py .
      - name: Package tested commit
        if: github.event_name == 'push'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$TMPDIR/release"
          scripts/package-release.sh "$TMPDIR/release"
          cd "$TMPDIR/release"
          sha256sum --check checksums.txt
          archive=$(find . -maxdepth 1 -name 'hopper_*_linux_amd64.zip' -print)
          unzip -p "$archive" hopper.so > hopper.so
          sha256sum hopper.so > library-sha256.txt
          rm hopper.so
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'run=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'go=%s\n' "$(go version)"
            printf 'registry_version=%s\n' "$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["plugins"][0]["version"])' "$GITHUB_WORKSPACE/registry.json")"
          } > provenance.txt
      - name: Retain release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hopper-linux-amd64-${{ github.sha }}
          path: ${{ env.TMPDIR }}/release/
          if-no-files-found: error
          retention-days: 7
      - name: Remove scratch directory
        if: always()
        run: |
          if [[ -n "${TMPDIR:-}" && "$TMPDIR" == "$HOME/.cache/hopper-ci."* ]]; then rm -rf -- "$TMPDIR"; fi
